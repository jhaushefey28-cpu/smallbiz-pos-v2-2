name: SmallBiz Sidebar Layout Source Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove sidebar scroll reset and enforce source layout
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const V37='apply-sidebar-system-canonical-v37.mjs';
          const CSS='styles.css';
          let v37=fs.readFileSync(V37,'utf8');
          v37=v37.replace(/const next=document\.querySelector\("\.sidebar-nav"\);\n\s*if\(next\)next\.scrollTop=0;\n\s*/,'');
          fs.writeFileSync(V37,v37);

          let css=fs.readFileSync(CSS,'utf8');
          if(!css.includes('/* SMALLBIZ SIDEBAR SOURCE LAYOUT V38 */')){
            css += `\n\n/* SMALLBIZ SIDEBAR SOURCE LAYOUT V38 */\n.sidebar {\n  height: 100dvh;\n  min-height: 0;\n  overflow: hidden;\n}\n.sidebar-nav {\n  flex: 1 1 auto;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  overscroll-behavior-y: auto;\n  -webkit-overflow-scrolling: touch;\n  touch-action: pan-y;\n}\n.sidebar-bottom {\n  flex: 0 0 auto;\n  margin-top: 0;\n}\n`;
          }
          fs.writeFileSync(CSS,css);
          console.log('[SmallBiz] Sidebar source layout V38 applied.');
          NODE
          git config user.name "smallbiz-sidebar-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apply-sidebar-system-canonical-v37.mjs styles.css
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Stabilize sidebar scroll and preserve menu position" && git push origin HEAD:main; fi
