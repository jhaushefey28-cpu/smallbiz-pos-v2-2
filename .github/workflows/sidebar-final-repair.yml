name: SmallBiz One-Time Sidebar Source Migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize the current runtime fixes into source
        shell: bash
        run: |
          set -euo pipefail
          node apply-sidebar-hard-stop-v40.mjs
          node apply-tenant-permission-model.mjs
          node apply-sidebar-routing-and-module-isolation-v1.mjs
          node apply-attendance-dom-isolation-v1.mjs

      - name: Remove build-time mutation layer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='package.json';
          const pkg=JSON.parse(fs.readFileSync(path,'utf8'));
          pkg.scripts={...pkg.scripts,build:'vite build'};
          pkg._buildTrigger='2026-08-27-sidebar-source-canonical-v1';
          fs.writeFileSync(path,JSON.stringify(pkg,null,2)+'\n');
          NODE
          rm -f apply-sidebar-hard-stop-v40.mjs apply-tenant-permission-model.mjs apply-sidebar-routing-and-module-isolation-v1.mjs apply-attendance-dom-isolation-v1.mjs
          rm -f .github/workflows/sidebar-layout-source-repair.yml .github/workflows/sidebar-final-repair.yml

      - name: Verify source is now canonical
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const main=fs.readFileSync('main.jsx','utf8');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const required=['data-smallbiz-react-sidebar="true"','function selectSidebarPage(key)','async function loadEffectivePermissions','window.__SMALLBIZ_REACT_SIDEBAR_OWNER__=true','requestSidebarModuleOpen("smallbiz:open-channels")','window.__SMALLBIZ_SUPABASE__=supabase'];
          for(const marker of required){if(!main.includes(marker))throw new Error('Missing canonical source marker: '+marker)}
          if(pkg.scripts.build!=='vite build')throw new Error('Build script still mutates source.')
          console.log('[SmallBiz] Canonical source migration verified. Build is now Vite-only.');
          NODE

      - name: Commit canonical source and remove migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "smallbiz-source-migration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No migration changes detected."; exit 0; fi
          git commit -m "Make sidebar navigation source-canonical"
          git push origin HEAD:main
