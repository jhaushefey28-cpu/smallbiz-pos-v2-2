name: Fix mobile login stack

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'mobile-login-stack-fixed') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove competing mobile submit/reload handlers
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove the old inline touch/fallback handler. React owns form submit now.
          text, n1 = re.subn(
              r'\n<script>\n\(function\(\)\{\n  const install=\(\)=>\{.*?\n\}\)\(\);\n</script>',
              '', text, count=1, flags=re.S
          )

          # Remove the second mobile stabilizer, which independently listens for
          # click/pointer/touch and can submit the same React form a second time.
          text, n2 = re.subn(
              r'<script type="module" src="/mobile-login-stabilizer\.js\?v=4"></script>',
              '', text, count=1
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Expected login handlers not found: inline={n1}, stabilizer={n2}')

          p.write_text(text, encoding='utf-8')

          # Make the main bundle cache-busting explicit for the new source.
          text = text.replace('/main.jsx?v=20260818-loginfix', '/main.jsx?v=20260819-mobile-login-clean')
          p.write_text(text, encoding='utf-8')

      - name: Remove temporary probe files
        shell: bash
        run: |
          git rm -f __probe__.txt __probe2__.txt __probe3__.txt __probe4__.txt __probe5__.txt 2>/dev/null || true

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove duplicate mobile login handlers [mobile-login-stack-fixed]'
          git push origin HEAD:main
