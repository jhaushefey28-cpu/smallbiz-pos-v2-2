<!doctype html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#ffffff"/>
  <title>SmallBiz POS V2.2</title>
  <!-- Login CSS is intentionally the ONLY optional stylesheet loaded before authentication. -->
  <link rel="stylesheet" href="/mobile-login-fix.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.jsx"></script>
  <script>
  (function(){
    const styles=[
      '/sidebar-fix.css','/platform-channel-admin.css','/responsive-pos.css','/reports-center.css',
      '/mobile-cart-float.css','/business-controls-scroll-fix.css','/cashier-shift.css'
    ];
    const modules=[
      '/auth-recovery.js','/reprint-modal-fix.js','/void-reason-enhancement.js','/transaction-audit-enhancement.js',
      '/team-management.js','/sales-channels.jsx','/product-channel-mapping.jsx','/order-management-shipment-hotfix.js',
      '/order-management.jsx','/platform-channel-admin.js','/marketplace-connections.jsx','/marketplace-oauth-connect.js',
      '/marketplace-sync-readiness.jsx','/marketplace-stock-reservation.jsx','/marketplace-fulfillment.jsx','/report-export-engine.js',
      '/reports-center.js','/business-controls.jsx','/inventory-center.jsx','/growth-center.jsx','/growth-center-sidebar-fix.js','/cashier-shift.jsx',
      '/mobile-cart-float.js'
    ];
    let started=false;
    function loadEnhancements(){
      if(started || document.querySelector('.login-card')) return;
      started=true;
      styles.forEach(href=>{
        if(!document.querySelector('link[data-smallbiz-enhancement="'+href+'"]')){
          const link=document.createElement('link');
          link.rel='stylesheet'; link.href=href; link.dataset.smallbizEnhancement=href;
          document.head.appendChild(link);
        }
      });
      // Load optional POS modules only after authentication is visible.
      modules.forEach((src,i)=>setTimeout(()=>import(src).catch(()=>{}),i*35));
      observer.disconnect();
    }
    const observer=new MutationObserver(loadEnhancements);
    function boot(){
      loadEnhancements();
      observer.observe(document.getElementById('root')||document.body,{subtree:true,childList:true});
      setTimeout(loadEnhancements,3000);
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});
    else boot();
  })();
  </script>
</body>
</html>
